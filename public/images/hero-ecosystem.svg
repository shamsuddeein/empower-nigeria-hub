<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091322"/>
      <stop offset="40%" stop-color="#0e1d33"/>
      <stop offset="100%" stop-color="#132742"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>

  <!-- Sun and Clean Energy Glow -->
  <circle cx="240" cy="220" r="260" fill="url(#sunGrad)"/>
  <circle cx="240" cy="220" r="80" fill="#fef3c7" opacity="0.2" filter="url(#glow)"/>

  <!-- Perspective Land Topography Contours (Right and Midground) -->
  <g opacity="0.6">
    <path d="M550,560 Q750,480 1200,530 L1200,800 L550,800 Z" fill="#111c2e"/>
    <path d="M700,540 Q900,470 1200,500 L1200,680 Q950,640 700,540 Z" fill="#0d2238" opacity="0.7"/>
    <!-- Regional Land Cadastral Lines -->
    <path d="M720,535 L860,610 L1020,570 L890,510 Z" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
    <path d="M860,610 L980,700 L1150,650 L1020,570 Z" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
    <circle cx="720" cy="535" r="3.5" fill="#34d399"/>
    <circle cx="860" cy="610" r="3.5" fill="#34d399"/>
    <circle cx="1020" cy="570" r="3.5" fill="#34d399"/>
    <circle cx="890" cy="510" r="3.5" fill="#34d399"/>
    <!-- Minimalist stylized landscape trees -->
    <g transform="translate(1080, 480)" opacity="0.5">
      <path d="M0,25 Q3,10 5,0 Q7,10 10,25 Z" fill="#1e293b"/>
      <ellipse cx="5" cy="-5" rx="26" ry="8" fill="#065f46"/>
      <ellipse cx="12" cy="-12" rx="18" ry="6" fill="#047857"/>
    </g>
    <g transform="translate(1140, 495)" opacity="0.4">
      <path d="M0,20 Q2,8 4,0 Q6,8 8,20 Z" fill="#1e293b"/>
      <ellipse cx="4" cy="-4" rx="20" ry="6" fill="#065f46"/>
    </g>
  </g>

  <!-- Paved Commercial Ground / Base Surface -->
  <path d="M0,520 L620,520 L750,800 L0,800 Z" fill="url(#groundGrad)"/>
  <line x1="0" y1="520" x2="620" y2="520" stroke="#334155" stroke-width="2"/>

  <!-- 1. Commercial Solar Architecture (Left Section) -->
  <g transform="translate(40, 240)">
    <!-- Modern commercial canopy frame -->
    <rect x="40" y="160" width="360" height="120" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Vertical structural posts -->
    <rect x="70" y="180" width="14" height="140" fill="#475569"/>
    <rect x="350" y="180" width="14" height="140" fill="#475569"/>
    <rect x="210" y="180" width="14" height="140" fill="#334155"/>

    <!-- Inclined Photovoltaic Solar Array Roof Structure -->
    <polygon points="20,160 380,100 420,120 60,180" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    
    <!-- Photovoltaic Panel Modules (Grid) -->
    <g>
      <!-- Row 1 -->
      <polygon points="35,162 110,147 122,152 47,167" fill="url(#panelGrad)" stroke="#93c5fd" stroke-width="0.8"/>
      <polygon points="115,146 190,131 202,136 127,151" fill="url(#panelGrad)" stroke="#93c5fd" stroke-width="0.8"/>
      <polygon points="195,130 270,115 282,120 207,135" fill="url(#panelGrad)" stroke="#93c5fd" stroke-width="0.8"/>
      <polygon points="275,114 350,99 362,104 287,119" fill="url(#panelGrad)" stroke="#93c5fd" stroke-width="0.8"/>
      <!-- Row 2 -->
      <polygon points="50,168 125,153 137,158 62,173" fill="url(#panelGrad)" stroke="#93c5fd" stroke-width="0.8"/>
      <polygon points="130,152 205,137 217,142 142,157" fill="url(#panelGrad)" stroke="#93c5fd" stroke-width="0.8"/>
      <polygon points="210,136 285,121 297,126 222,141" fill="url(#panelGrad)" stroke="#93c5fd" stroke-width="0.8"/>
      <polygon points="290,120 365,105 377,110 302,125" fill="url(#panelGrad)" stroke="#93c5fd" stroke-width="0.8"/>
    </g>

    <!-- Energy Storage Unit / Commercial Inverter Enclosure (Ground Mounted) -->
    <g transform="translate(110, 210)">
      <rect x="0" y="0" width="75" height="105" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <!-- Battery status LED bars -->
      <line x1="15" y1="20" x2="60" y2="20" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <line x1="15" y1="32" x2="60" y2="32" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <line x1="15" y1="44" x2="60" y2="44" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <line x1="15" y1="56" x2="45" y2="56" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <circle cx="55" cy="80" r="6" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <path d="M53,80 L57,80 M55,78 L55,82" stroke="#38bdf8" stroke-width="1.5"/>
    </g>
  </g>

  <!-- 2. Electric Commercial Mobility (Center-Left) -->
  <g transform="translate(390, 450)">
    <!-- Ground Shadow -->
    <ellipse cx="110" cy="175" rx="115" ry="16" fill="#070d18" opacity="0.7"/>

    <!-- Rear Wheel with Hub Motor -->
    <circle cx="45" cy="140" r="38" fill="#0f172a" stroke="#334155" stroke-width="8"/>
    <circle cx="45" cy="140" r="26" fill="#1e293b" stroke="#059669" stroke-width="2"/>
    <circle cx="45" cy="140" r="10" fill="#0f172a"/>

    <!-- Front Wheel -->
    <circle cx="185" cy="140" r="38" fill="#0f172a" stroke="#334155" stroke-width="8"/>
    <circle cx="185" cy="140" r="26" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <circle cx="185" cy="140" r="10" fill="#0f172a"/>

    <!-- Bike Frame Structure (Minimalist modern electric cargo bike) -->
    <path d="M45,140 L95,130 L135,140 L185,140" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M95,130 L105,75 L160,70 L185,140" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M105,75 L70,80 L45,140" fill="none" stroke="#047857" stroke-width="4" stroke-linecap="round"/>

    <!-- Battery Compartment Module -->
    <rect x="85" y="90" width="40" height="45" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <path d="M102,98 L108,108 L102,108 L106,120 L98,110 L104,110 Z" fill="#10b981"/>

    <!-- Handlebars and Front Fork -->
    <line x1="160" y1="70" x2="150" y2="45" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <line x1="135" y1="43" x2="165" y2="47" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <!-- LED Headlamp -->
    <polygon points="170,55 185,52 185,62 170,59" fill="#38bdf8"/>

    <!-- Commercial Rear Cargo Carrier Rack & Storage Box -->
    <rect x="20" y="58" width="55" height="42" rx="3" fill="#1e293b" stroke="#059669" stroke-width="2"/>
    <line x1="20" y1="75" x2="75" y2="75" stroke="#334155" stroke-width="1"/>
    <rect x="25" y="64" width="12" height="6" rx="1" fill="#10b981" opacity="0.8"/>

    <!-- Saddle -->
    <path d="M88,72 Q105,68 115,75 Q98,80 88,72 Z" fill="#020617"/>
  </g>

  <!-- 3. Digital Technology and Business Tools (Foreground Right) -->
  <g transform="translate(720, 360)">
    <!-- Modern Business Laptop -->
    <g transform="translate(50, 40)">
      <!-- Screen Housing -->
      <polygon points="40,120 320,120 300,0 60,0" fill="#0f172a" stroke="#475569" stroke-width="3"/>
      <!-- Active Screen Display -->
      <polygon points="48,112 312,112 294,8 66,8" fill="url(#screenGrad)"/>
      <!-- Digital Metrics & Analytics Graphics on Screen -->
      <!-- Energy Production Curve -->
      <path d="M85,90 Q140,40 190,65 T280,25" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <!-- Bar Chart -->
      <rect x="95" y="60" width="12" height="35" fill="#38bdf8" rx="1" opacity="0.8"/>
      <rect x="115" y="45" width="12" height="50" fill="#38bdf8" rx="1" opacity="0.8"/>
      <rect x="135" y="52" width="12" height="43" fill="#38bdf8" rx="1" opacity="0.8"/>
      <!-- Laptop Base / Keyboard Deck -->
      <polygon points="10,140 350,140 320,120 40,120" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
      <!-- Trackpad -->
      <polygon points="150,136 210,136 205,126 155,126" fill="#1e293b"/>
    </g>

    <!-- Contemporary Smartphone beside Laptop -->
    <g transform="translate(390, 100)">
      <!-- Phone Body -->
      <rect x="0" y="0" width="75" height="145" rx="12" fill="#020617" stroke="#64748b" stroke-width="2.5"/>
      <!-- Phone Screen -->
      <rect x="4" y="5" width="67" height="135" rx="9" fill="url(#screenGrad)"/>
      <!-- Top Speaker Notch -->
      <rect x="28" y="8" width="18" height="3" rx="1.5" fill="#475569"/>
      <!-- Mobile App Dashboard Interface -->
      <rect x="10" y="20" width="55" height="18" rx="3" fill="#047857" opacity="0.6"/>
      <rect x="10" y="45" width="25" height="35" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="40" y="45" width="25" height="35" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="22" cy="62" r="6" fill="#10b981" opacity="0.8"/>
      <circle cx="52" cy="62" r="6" fill="#f59e0b" opacity="0.8"/>
      <rect x="10" y="90" width="55" height="20" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <line x1="16" y1="100" x2="45" y2="100" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Ambient Light Reflection on Foreground Ground -->
  <ellipse cx="840" cy="580" rx="180" ry="35" fill="#10b981" opacity="0.06" filter="url(#glow)"/>
  <ellipse cx="480" cy="620" rx="140" ry="30" fill="#38bdf8" opacity="0.05" filter="url(#glow)"/>
</svg>